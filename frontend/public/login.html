<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login · Lost & Found Hub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="bar"><a class="brand" href="/"><i></i>Lost &amp; Found Hub</a></header>
  <form class="login" id="form">
    <h1>Staff login</h1>
    <label>Name <input name="name" required autocomplete="username" autofocus></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn">Log in</button>
  </form>
  <script type="module">
    import { api } from '/js/common.js';
    document.querySelector('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try { await api('/api/auth/login', { method: 'POST', body }); location.href = '/staff'; }
      catch (ex) { document.querySelector('#err').textContent = ex.message; }
    });
  </script>
</body>
</html>
